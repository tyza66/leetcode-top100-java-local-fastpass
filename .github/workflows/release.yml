name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: '--target x86_64-apple-darwin'
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: '--target x86_64-pc-windows-msvc'
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: '--target x86_64-unknown-linux-gnu'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libssl-dev

      - name: Install frontend dependencies
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'LeetCode Top100 Java ${{ github.ref_name }}'
          releaseBody: 'See the assets to download this version and install.'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Collect bundle artifacts
        id: bundles
        shell: bash
        run: |
          BUNDLE_DIR="src-tauri/target/${{ matrix.target }}/release/bundle"
          if [ -d "$BUNDLE_DIR" ]; then
            FILES=$(find "$BUNDLE_DIR" -type f \( \
              -name '*.dmg' -o \
              -name '*.msi' -o \
              -name '*.exe' -o \
              -name '*.deb' -o \
              -name '*.AppImage' -o \
              -name '*.tar.gz' -o -name '*.zip' -o \
              -name '*.rpm' \) | sort)
            echo "files<<EOF" >> "$GITHUB_OUTPUT"
            echo "$FILES" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
            COUNT=$(echo "$FILES" | grep -c . || true)
            echo "count=$COUNT" >> "$GITHUB_OUTPUT"
            echo "Found $COUNT artifacts:"
            echo "$FILES"
          else
            echo "count=0" >> "$GITHUB_OUTPUT"
            echo "No bundle dir at $BUNDLE_DIR"
          fi

      - name: Generate platform checksums
        if: steps.bundles.outputs.count != '0'
        shell: bash
        run: |
          MATRIX_ID="${{ matrix.platform }}-${{ matrix.target }}"
          : > "${MATRIX_ID}-checksums-md5.txt"
          : > "${MATRIX_ID}-checksums-sha1.txt"
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            md5sum "$f" >> "${MATRIX_ID}-checksums-md5.txt"
            sha1sum "$f" >> "${MATRIX_ID}-checksums-sha1.txt"
          done <<< "${{ steps.bundles.outputs.files }}"

      - name: Upload platform checksums to release
        if: steps.bundles.outputs.count != '0'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MATRIX_ID="${{ matrix.platform }}-${{ matrix.target }}"
          gh release upload ${{ github.ref_name }} --repo ${{ github.repository }} \
            "${MATRIX_ID}-checksums-md5.txt" \
            "${MATRIX_ID}-checksums-sha1.txt" \
            --clobber

  aggregate-checksums:
    needs: build-tauri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download ${{ github.ref_name }} \
            --pattern '*-checksums-*.txt' \
            --dir /tmp/checksums \
            --clobber

      - name: Merge checksums
        run: |
          cd /tmp/checksums
          cat *-checksums-md5.txt > checksums-md5.txt
          cat *-checksums-sha1.txt > checksums-sha1.txt
          echo "--- checksums-md5.txt ---"
          cat checksums-md5.txt
          echo "--- checksums-sha1.txt ---"
          cat checksums-sha1.txt

      - name: Upload merged checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd /tmp/checksums
          gh release upload ${{ github.ref_name }} --repo ${{ github.repository }} \
            checksums-md5.txt \
            checksums-sha1.txt \
            --clobber
